<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Boardline screenshot</title>
    <style>
      /* Obsidian's default theme: the variables src/plugin.css turns into the board's --bl-* colors. */
      body {
        --interactive-accent: hsl(254, 80%, 68%);
        --interactive-accent-hsl: 254, 80%, 68%;
        --text-error: #e93147;
        --font-interface: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
        --font-monospace: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, monospace;
        --font-ui-small: 13px;
        --font-ui-smaller: 12px;
        --radius-s: 4px;
        --radius-m: 8px;
        margin: 0;
        background: var(--background-primary);
      }
      body.theme-light {
        --background-primary: #ffffff;
        --background-secondary: #f6f6f6;
        --background-modifier-hover: rgba(0, 0, 0, 0.075);
        --background-modifier-border: #e0e0e0;
        --text-normal: #222222;
        --text-muted: #5c5c5c;
        --text-faint: #ababab;
        --canvas-dot-pattern: #e0e0e0;
      }
      body.theme-dark {
        --background-primary: #1e1e1e;
        --background-secondary: #262626;
        --background-modifier-hover: rgba(255, 255, 255, 0.075);
        --background-modifier-border: #363636;
        --text-normal: #dadada;
        --text-muted: #b3b3b3;
        --text-faint: #666666;
        --canvas-dot-pattern: #3f3f3f;
      }
    </style>
  </head>
  <body class="theme-light">
    <div class="bl-view" style="position: fixed; inset: 0"><div class="bl-mount" id="mount"></div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
